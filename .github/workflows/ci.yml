name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Windows Build & Test
    runs-on: windows-latest
    # The 20x flakiness loop re-runs the full (now genuinely serial, per B-03)
    # suite 20 times; this job took 25m20s on run 33230139355 with 1008 tests,
    # leaving only ~5 min of headroom against the previous 30-minute limit.
    # 45 minutes gives real margin for continued test-suite growth.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.301'

      - name: Show environment
        run: dotnet --info

      - name: Restore
        run: dotnet restore AssetProvenanceHelper.sln

      - name: Debug build - warnings are errors
        run: >
          dotnet build AssetProvenanceHelper.sln
          -c Debug
          --no-restore
          -warnaserror

      - name: Debug tests
        run: >
          dotnet test AssetProvenanceHelper.sln
          -c Debug
          --no-build
          --logger "trx;LogFileName=debug.trx"

      - name: Release build - warnings are errors
        run: >
          dotnet build AssetProvenanceHelper.sln
          -c Release
          --no-restore
          -warnaserror

      - name: Release tests
        run: >
          dotnet test AssetProvenanceHelper.sln
          -c Release
          --no-build
          --logger "trx;LogFileName=release.trx"

      - name: RecoveryCritical tests
        run: >
          dotnet test tests/AssetProvenanceHelper.Tests/AssetProvenanceHelper.Tests.csproj
          -c Release
          --no-build
          --filter "Category=RecoveryCritical"
          --logger "trx;LogFileName=recovery-critical.trx"

      - name: Flakiness 20x test loop
        shell: pwsh
        run: |
          for ($i = 1; $i -le 20; $i++) {
            dotnet test AssetProvenanceHelper.sln -c Release --no-build --logger "console;verbosity=minimal"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Flakiness run $i failed"
              exit $LASTEXITCODE
            }
          }

      - name: Prepare clean publish directory
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $PWD "artifacts/publish"
          if (Test-Path -LiteralPath $publishDirectory) {
            Remove-Item -LiteralPath $publishDirectory -Recurse -Force
          }

      - name: Publish win-x64
        run: >
          dotnet publish
          src/AssetProvenanceHelper/AssetProvenanceHelper.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:SourceRevisionId=${{ github.sha }}
          -o artifacts/publish

      - name: Verify Published Package Integrity & Process Startup Smoke
        shell: pwsh
        run: pwsh scripts/run_smoke_tests.ps1 -PublishDir artifacts/publish -LogOutputDir artifacts

      - name: Upload test and publish artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-artifacts
          path: |
            **/*.trx
            artifacts/publish/**
            artifacts/AssetProvenanceHelper-v*-win-x64.zip
            artifacts/smoke-test-log.json

  coverage:
    name: Coverage Gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.301'

      - name: Restore
        run: dotnet restore AssetProvenanceHelper.sln

      - name: Build Release
        run: >
          dotnet build AssetProvenanceHelper.sln
          -c Release
          --no-restore
          -warnaserror

      - name: Test with Coverage
        run: dotnet test tests/AssetProvenanceHelper.Tests/AssetProvenanceHelper.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/coverage

      - name: Verify Coverage Artifact
        shell: pwsh
        run: pwsh scripts/verify_coverage.ps1

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: artifacts/coverage/**
