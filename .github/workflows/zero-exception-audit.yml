name: Zero-Exception Audit

# Manually-dispatched, non-fail-fast audit that runs every phase regardless of
# earlier failures and aggregates the results at the end. Normal CI (ci.yml)
# stays fail-fast for fast feedback; this workflow exists so a single early
# failure never hides whether every other phase would have passed.
#
# This does not replace ci.yml and does not gate merges by itself.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Zero-Exception Audit
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      # Checkout/Setup/Restore are ordinary prerequisite steps for every job
      # on this runner, but this workflow's entire stated purpose is showing
      # every independently runnable phase's result in one place - a Restore
      # failure should not silently skip everything after it and be
      # indistinguishable from those phases never having been attempted.
      # continue-on-error + explicit ids let each one report its own outcome
      # in the aggregator below, same as every phase step further down.
      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        id: setup_dotnet
        continue-on-error: true
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.301'

      - name: Record target SHA and tree status
        id: record_environment
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/audit | Out-Null
          $sha = git rev-parse HEAD
          $status = git status --porcelain=v1
          $info = dotnet --info | Out-String
          @{
            Sha = $sha
            Clean = ($status.Length -eq 0)
            Status = $status
            DotnetInfo = $info
            Timestamp = (Get-Date).ToString("o")
          } | ConvertTo-Json -Depth 5 | Set-Content artifacts/audit/environment.json
          Write-Host "HEAD: $sha"
          Write-Host "Clean tree: $($status.Length -eq 0)"

      - name: Restore
        id: restore
        if: always()
        continue-on-error: true
        run: dotnet restore AssetProvenanceHelper.sln

      - name: Debug build (-warnaserror)
        id: debug_build
        if: always()
        continue-on-error: true
        run: dotnet build AssetProvenanceHelper.sln -c Debug --no-restore --no-incremental -warnaserror

      - name: Debug tests
        id: debug_tests
        if: always()
        continue-on-error: true
        run: dotnet test AssetProvenanceHelper.sln -c Debug --no-build --logger "trx;LogFileName=debug.trx"

      - name: Release build (-warnaserror)
        id: release_build
        if: always()
        continue-on-error: true
        run: dotnet build AssetProvenanceHelper.sln -c Release --no-restore --no-incremental -warnaserror

      - name: Release tests
        id: release_tests
        if: always()
        continue-on-error: true
        run: dotnet test AssetProvenanceHelper.sln -c Release --no-build --logger "trx;LogFileName=release.trx"

      - name: RecoveryCritical tests
        id: recovery_critical
        if: always()
        continue-on-error: true
        run: >
          dotnet test tests/AssetProvenanceHelper.Tests/AssetProvenanceHelper.Tests.csproj
          -c Release --no-build --filter "Category=RecoveryCritical"
          --logger "trx;LogFileName=recovery-critical.trx"

      - name: Coverage ratchet unit scenarios
        id: coverage_ratchet_unit_tests
        if: always()
        continue-on-error: true
        shell: pwsh
        run: pwsh scripts/verify_coverage.ratchet.tests.ps1

      - name: Coverage collection
        id: coverage
        if: always()
        continue-on-error: true
        run: >
          dotnet test tests/AssetProvenanceHelper.Tests/AssetProvenanceHelper.Tests.csproj
          -c Release --no-build --collect:"XPlat Code Coverage"
          --results-directory artifacts/coverage

      - name: Coverage gate
        id: coverage_gate
        if: always()
        continue-on-error: true
        shell: pwsh
        run: pwsh scripts/verify_coverage.ps1

      - name: Flakiness 20x loop
        id: flakiness
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          for ($i = 1; $i -le 20; $i++) {
            dotnet test AssetProvenanceHelper.sln -c Release --no-build --logger "console;verbosity=minimal"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Flakiness run $i failed"
              exit 1
            }
          }

      - name: Historically-flaky test x100
        id: flake_repeat
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          for ($i = 1; $i -le 100; $i++) {
            dotnet test tests/AssetProvenanceHelper.Tests/AssetProvenanceHelper.Tests.csproj `
              -c Release --no-build `
              --filter "FullyQualifiedName~Overlay_TimerKeepsOpenWhileCursorOverPreviewAndClosesAfter" `
              --logger "console;verbosity=minimal"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Flaky-test repeat $i failed"
              exit 1
            }
          }

      - name: Leaked temp workspace check
        id: leak_check
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $leakDir = Join-Path $env:TEMP "AssetProvenanceHelperTests"
          if (Test-Path $leakDir) {
            $count = (Get-ChildItem -Directory $leakDir -ErrorAction SilentlyContinue | Measure-Object).Count
            Write-Host "Leaked TestWorkspace directories: $count"
            if ($count -gt 0) { exit 1 }
          } else {
            Write-Host "No leak directory present."
          }

      - name: Publish win-x64
        id: publish
        if: always()
        continue-on-error: true
        run: >
          dotnet publish src/AssetProvenanceHelper/AssetProvenanceHelper.csproj
          -c Release -r win-x64 --self-contained true
          -p:SourceRevisionId=${{ github.sha }} -o artifacts/publish

      - name: Package structural verification (SAC-safe)
        id: smoke_structural
        if: always()
        continue-on-error: true
        shell: pwsh
        run: pwsh scripts/run_smoke_tests_sac_safe.ps1

      - name: Mutation testing
        id: mutation
        if: always()
        continue-on-error: true
        working-directory: tests/AssetProvenanceHelper.Tests
        run: |
          dotnet tool restore
          dotnet stryker

      - name: Aggregate results
        if: always()
        shell: pwsh
        run: |
          $steps = @{
            Checkout          = '${{ steps.checkout.outcome }}'
            SetupDotnet       = '${{ steps.setup_dotnet.outcome }}'
            RecordEnvironment = '${{ steps.record_environment.outcome }}'
            Restore           = '${{ steps.restore.outcome }}'
            DebugBuild        = '${{ steps.debug_build.outcome }}'
            DebugTests        = '${{ steps.debug_tests.outcome }}'
            ReleaseBuild      = '${{ steps.release_build.outcome }}'
            ReleaseTests      = '${{ steps.release_tests.outcome }}'
            RecoveryCritical  = '${{ steps.recovery_critical.outcome }}'
            CoverageRatchetUnitTests = '${{ steps.coverage_ratchet_unit_tests.outcome }}'
            Coverage          = '${{ steps.coverage.outcome }}'
            CoverageGate      = '${{ steps.coverage_gate.outcome }}'
            Flakiness20x      = '${{ steps.flakiness.outcome }}'
            FlakyRepeat100x   = '${{ steps.flake_repeat.outcome }}'
            LeakCheck         = '${{ steps.leak_check.outcome }}'
            Publish           = '${{ steps.publish.outcome }}'
            SmokeStructural   = '${{ steps.smoke_structural.outcome }}'
            Mutation          = '${{ steps.mutation.outcome }}'
          }

          $steps.GetEnumerator() | Sort-Object Name | ForEach-Object {
            Write-Host ("{0,-18}: {1}" -f $_.Name, $_.Value)
          }

          New-Item -ItemType Directory -Force -Path artifacts/audit | Out-Null
          $steps | ConvertTo-Json | Set-Content artifacts/audit/phase-outcomes.json

          $failed = $steps.GetEnumerator() | Where-Object { $_.Value -eq 'failure' }
          if ($failed) {
            Write-Error "Required phase(s) failed: $($failed.Name -join ', ')"
            exit 1
          }

      - name: Upload all audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zero-exception-audit
          path: |
            **/*.trx
            artifacts/audit/**
            artifacts/coverage/**
            artifacts/publish/**
            tests/AssetProvenanceHelper.Tests/StrykerOutput/**
